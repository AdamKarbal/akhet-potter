version: '3.8'

services:
  db:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  auth:
    build: ./services/authService
    restart: always
    environment:
      - MONGO_URL=mongodb://db:27017
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - db

  files:
    build: ./services/files
    restart: always
    networks:
      - app-network
    volumes:
      - ./services/files:/app
      - /app/node_modules

  gateway:
    build: ./services/gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - AUTH_URL=http://auth:8002
      - FILES_URL=http://files:8001
    networks:
      - app-network
    depends_on:
      - auth
      - files
      - social

  game:
    build: ./services/backend
    restart: always
    ports:
      - "8003:8003"
    networks:
      - app-network
    env_file:
      - .env

  social:
    build: ./services/socialService
    restart: always
    env_file:
      - .env
    networks:
      - app-network

  succes:
    build: ./services/succesService
    restart: always
    environment:
      - MONGO_URL=mongodb://db:27017
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - db

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge