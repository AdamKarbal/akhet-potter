version: '3.8'

services:
  db:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  auth:
    build: ./services/authService
    restart: always
    environment:
      - .env
    networks:
      - app-network
    depends_on:
      - db

  files:
    build: ./services/files
    restart: always
    networks:
      - app-network
    volumes:
      - ./services/files:/app
      - /app/node_modules

  gateway:
    build: ./services/gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - .env
    networks:
      - app-network
    depends_on:
      - auth
      - files

  game:
    build: ./services/backend
    restart: always
    ports:
      - "8003:8003"
    networks:
      - app-network
    environment:
      - .env

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge